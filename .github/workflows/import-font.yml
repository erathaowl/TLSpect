name: Import pinned editor font

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-font.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and verify licensed font from CertScope
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/erathaowl/CertScope/v1.2.1/src/certscope/assets/JetBrainsMonoNerdFontMono-Regular.ttf" \
            -o assets/JetBrainsMonoNerdFontMono-Regular.ttf
          test "$(git hash-object assets/JetBrainsMonoNerdFontMono-Regular.ttf)" = \
            "7653ae018f929a9186b328a8a1990178f6afe5c1"
          test -s assets/OFL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/JetBrainsMonoNerdFontMono-Regular.ttf
          if ! git diff --cached --quiet; then
            git commit -m "Bundle pinned JetBrains Mono Nerd Font under OFL"
            git push origin HEAD:main
          fi

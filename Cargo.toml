[package]
name = "tlspect"
version = "0.1.0"
edition = "2024"
authors = ["erathaowl"]
license = "MIT"
description = "Native Windows X.509 certificate inspector and verifier"
repository = "https://github.com/erathaowl/TLSpect"
build = "build.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
openssl = { version = "0.10.81", features = ["vendored"] }
x509-parser = "0.17"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
url = "2.5"
rfd = "0.15"
webbrowser = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
